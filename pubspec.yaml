name: tripsplit_world
description: "TripSplit World — group travel budgeting, expense splitting, currency conversion, travel documents and global travel-safety assistance."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  csv: ^8.0.0
  decimal: ^3.2.4
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.1
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.2
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/emergency/
    - assets/data/
    - assets/images/
